name: BOAT RACE AI Auto Improve

on:
  workflow_dispatch:

  schedule:
    # 毎日 19:30 JST
    - cron: "30 10 * * *"

permissions:
  contents: read

concurrency:
  group: boat-race-ai-auto-improve
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture unchanged serving state
        run: python training/candidate_artifacts.py capture --kind auto-improve --directory candidate-output/auto-improve

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      # ==========================================================
      # 0. コード検査
      # ==========================================================

      - name: Syntax check
        run: |
          python -m py_compile training/experiment_v10_features.py
          python -m py_compile training/champion_challenger.py

      # ==========================================================
      # 1. 最新データでChampion vs Challenger再検証
      #
      # 本番model/model.jsonは変更しない
      # ==========================================================

      - name: Run latest paired OOS experiment
        run: |
          python training/experiment_v10_features.py \
            --train-days 120 \
            --validation-days 15 \
            --test-days 30 \
            --epochs 300 \
            --lr 0.035 \
            --l2 0.002 \
            --min-train-races 500 \
            --min-test-races 300 \
            --output candidate-output/auto-improve/experiment-v10-features.json

      # ==========================================================
      # 2. 自動昇格候補判定
      #
      # ここでは本番反映しない。
      # Gateを通過したモデルのみ
      # challenger-model.jsonへ保存。
      # ==========================================================

      - name: Seed candidate registry from existing history
        run: cp model/model-registry.json candidate-output/auto-improve/model-registry.json

      - name: Run champion challenger gate
        run: |
          python training/champion_challenger.py \
            --experiment candidate-output/auto-improve/experiment-v10-features.json \
            --registry candidate-output/auto-improve/model-registry.json \
            --candidate candidate-output/auto-improve/challenger-model.json

      # ==========================================================
      # 3. 安全性検証
      # ==========================================================

      - name: Validate auto improvement outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          experiment_path = Path(
              "candidate-output/auto-improve/experiment-v10-features.json"
          )

          registry_path = Path(
              "candidate-output/auto-improve/model-registry.json"
          )

          if not experiment_path.exists():
              raise SystemExit(
                  "experiment result missing"
              )

          if not registry_path.exists():
              raise SystemExit(
                  "model registry missing"
              )

          experiment = json.loads(
              experiment_path.read_text(
                  encoding="utf-8"
              )
          )

          registry = json.loads(
              registry_path.read_text(
                  encoding="utf-8"
              )
          )

          latest = registry.get(
              "latestChallenger"
          )

          if not latest:
              raise SystemExit(
                  "latest challenger record missing"
              )

          checks = latest.get(
              "checks",
              {}
          )

          required_checks = (
              "oosRaces",
              "winnerTop1",
              "winnerTop3",
              "trifectaTop3",
              "trifectaTop5",
              "logLoss",
              "brier",
          )

          for key in required_checks:
              if key not in checks:
                  raise SystemExit(
                      f"missing gate check: {key}"
                  )

          passed = bool(
              latest.get(
                  "passedGate"
              )
          )

          candidate_path = Path(
              "candidate-output/auto-improve/challenger-model.json"
          )

          if passed:
              if not candidate_path.exists():
                  raise SystemExit(
                      "gate passed but challenger model missing"
                  )

              candidate = json.loads(
                  candidate_path.read_text(
                      encoding="utf-8"
                  )
              )

              if (
                  candidate.get(
                      "productionPromoted"
                  )
                  is not False
              ):
                  raise SystemExit(
                      "candidate must not auto-promote"
                  )

              if (
                  candidate.get(
                      "status"
                  )
                  != "validated-challenger"
              ):
                  raise SystemExit(
                      "invalid challenger status"
                  )

          print(
              "AUTO IMPROVEMENT VALIDATION PASSED"
          )

          print(
              json.dumps(
                  {
                      "passedGate":
                          passed,

                      "checks":
                          checks,

                      "candidate":
                          registry.get(
                              "candidate"
                          ),

                      "productionChanged":
                          False,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      - name: Verify and seal candidate bundle
        id: seal
        run: python training/candidate_artifacts.py seal --kind auto-improve --directory candidate-output/auto-improve

      # This artifact is review material only. No workflow publishes or promotes it.
      - name: Save candidate bundle
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auto-improve-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-output/auto-improve/
          if-no-files-found: error
          retention-days: 14
          overwrite: false

      - name: Save incomplete research for diagnosis
        if: failure() && steps.seal.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auto-improve-INCOMPLETE-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-output/auto-improve/
          if-no-files-found: warn
          retention-days: 7
          overwrite: false
