name: BOAT RACE AI Autonomous Improvement

on:
  workflow_dispatch:
    inputs:
      candidates:
        description: "Number of AutoML candidates"
        required: false
        default: "64"

      top_k:
        description: "OOS finalists"
        required: false
        default: "8"

  schedule:
    # Every Monday 03:30 JST
    - cron: "30 18 * * 0"

permissions:
  contents: read

concurrency:
  group: boat-race-ai-autonomous-improvement
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Capture unchanged serving state
        run: python training/candidate_artifacts.py capture --kind automl --directory candidate-output/automl

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Resolve configuration
        id: config
        shell: bash
        run: |
          CANDIDATES="${{ github.event.inputs.candidates }}"
          TOP_K="${{ github.event.inputs.top_k }}"

          if [ -z "$CANDIDATES" ]; then
            CANDIDATES="64"
          fi

          if [ -z "$TOP_K" ]; then
            TOP_K="8"
          fi

          if ! [[ "$CANDIDATES" =~ ^[0-9]+$ ]]; then
            exit 1
          fi

          if ! [[ "$TOP_K" =~ ^[0-9]+$ ]]; then
            exit 1
          fi

          if [ "$CANDIDATES" -lt 2 ]; then
            CANDIDATES="2"
          fi

          if [ "$CANDIDATES" -gt 96 ]; then
            CANDIDATES="96"
          fi

          if [ "$TOP_K" -lt 2 ]; then
            TOP_K="2"
          fi

          if [ "$TOP_K" -gt 10 ]; then
            TOP_K="10"
          fi

          echo "candidates=$CANDIDATES" >> "$GITHUB_OUTPUT"
          echo "top_k=$TOP_K" >> "$GITHUB_OUTPUT"

      - name: Syntax checks
        run: |
          python -m py_compile training/experiment_v10_features.py
          python -m py_compile training/automl_search.py
          python -m py_compile training/auto_cycle.py
          node --check api/before.js

      - name: Run AutoML search
        run: |
          python training/automl_search.py \
            --train-days 120 \
            --validation-days 15 \
            --test-days 30 \
            --replication-shift 45 \
            --max-candidates "${{ steps.config.outputs.candidates }}" \
            --top-k "${{ steps.config.outputs.top_k }}" \
            --output candidate-output/automl/automl-search.json \
            --challenger candidate-output/automl/automl-challenger.json

      - name: Compare against current Champion
        run: |
          python training/auto_cycle.py \
            --candidate-only \
            --report candidate-output/automl/automl-search.json \
            --champion model/model.json \
            --challenger candidate-output/automl/automl-challenger.json \
            --cycle-report candidate-output/automl/auto-cycle.json

      - name: Verify and seal candidate bundle
        id: seal
        run: python training/candidate_artifacts.py seal --kind automl --directory candidate-output/automl

      # This artifact is review material only. No workflow publishes or promotes it.
      - name: Save candidate bundle
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: automl-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-output/automl/
          if-no-files-found: error
          retention-days: 14
          overwrite: false

      - name: Save incomplete research for diagnosis
        if: failure() && steps.seal.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: automl-INCOMPLETE-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-output/automl/
          if-no-files-found: warn
          retention-days: 7
          overwrite: false
