name: BOAT RACE AI AutoML

on:
  workflow_dispatch:
    inputs:
      candidates:
        description: "Number of model candidates"
        required: false
        default: "24"

      top_k:
        description: "Finalists for OOS replication"
        required: false
        default: "5"

  schedule:
    # 毎週月曜 03:30 JST
    - cron: "30 18 * * 0"

permissions:
  contents: write

concurrency:
  group: boat-race-ai-automl
  cancel-in-progress: false

jobs:
  automl:
    runs-on: ubuntu-latest

    # 候補探索＋2期間OOSなので余裕を持たせる
    timeout-minutes: 180

    steps:
      # ==========================================================
      # 0. Repository
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      # ==========================================================
      # 1. Safety checks
      # ==========================================================

      - name: Syntax check
        run: |
          python -m py_compile training/experiment_v10_features.py
          python -m py_compile training/automl_search.py
          python -m py_compile training/champion_challenger.py

      # ==========================================================
      # 2. Resolve search size
      #
      # Scheduled run:
      #   24 candidates
      #
      # Manual:
      #   workflow_dispatch input
      #
      # 上限96。
      # ==========================================================

      - name: Resolve AutoML configuration
        id: config
        shell: bash
        run: |
          CANDIDATES="${{ github.event.inputs.candidates }}"
          TOP_K="${{ github.event.inputs.top_k }}"

          if [ -z "$CANDIDATES" ]; then
            CANDIDATES="24"
          fi

          if [ -z "$TOP_K" ]; then
            TOP_K="5"
          fi

          if ! [[ "$CANDIDATES" =~ ^[0-9]+$ ]]; then
            echo "Invalid candidates input"
            exit 1
          fi

          if ! [[ "$TOP_K" =~ ^[0-9]+$ ]]; then
            echo "Invalid top_k input"
            exit 1
          fi

          if [ "$CANDIDATES" -lt 2 ]; then
            CANDIDATES="2"
          fi

          if [ "$CANDIDATES" -gt 96 ]; then
            CANDIDATES="96"
          fi

          if [ "$TOP_K" -lt 1 ]; then
            TOP_K="1"
          fi

          if [ "$TOP_K" -gt 10 ]; then
            TOP_K="10"
          fi

          echo "candidates=$CANDIDATES" >> "$GITHUB_OUTPUT"
          echo "top_k=$TOP_K" >> "$GITHUB_OUTPUT"

          echo "AutoML candidates: $CANDIDATES"
          echo "AutoML finalists: $TOP_K"

      # ==========================================================
      # 3. AutoML
      #
      # ・特徴量組み合わせ
      # ・Learning rate
      # ・L2
      # ・Epoch
      # ・Validation ranking
      # ・30-day OOS
      # ・45-day shifted replication OOS
      #
      # 本番モデルには触らない。
      # ==========================================================

      - name: Run AutoML search
        run: |
          python training/automl_search.py \
            --train-days 120 \
            --validation-days 15 \
            --test-days 30 \
            --replication-shift 45 \
            --max-candidates "${{ steps.config.outputs.candidates }}" \
            --top-k "${{ steps.config.outputs.top_k }}" \
            --output model/automl-search.json \
            --challenger model/automl-challenger.json

      # ==========================================================
      # 4. Validate result
      # ==========================================================

      - name: Validate AutoML report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path(
              "model/automl-search.json"
          )

          if not report_path.exists():
              raise SystemExit(
                  "AutoML report missing"
              )

          report = json.loads(
              report_path.read_text(
                  encoding="utf-8"
              )
          )

          required = [
              "version",
              "candidateCount",
              "finalistCount",
              "finalists",
              "best",
              "baseline",
              "promotionCandidate",
          ]

          for key in required:
              if key not in report:
                  raise SystemExit(
                      f"missing AutoML field: {key}"
                  )

          if (
              report["candidateCount"]
              < 2
          ):
              raise SystemExit(
                  "candidateCount too small"
              )

          if not report["finalists"]:
              raise SystemExit(
                  "no finalists"
              )

          best = report["best"]
          baseline = report["baseline"]

          for item_name, item in (
              ("best", best),
              ("baseline", baseline),
          ):
              for period in (
                  "latest",
                  "replication",
              ):
                  metrics = item.get(
                      period
                  )

                  if not metrics:
                      raise SystemExit(
                          f"{item_name} {period} missing"
                      )

                  for metric in (
                      "races",
                      "winnerTop1",
                      "winnerTop3",
                      "trifectaTop1",
                      "trifectaTop3",
                      "trifectaTop5",
                      "logLoss",
                      "brier",
                  ):
                      if metric not in metrics:
                          raise SystemExit(
                              f"missing metric: "
                              f"{item_name} "
                              f"{period} "
                              f"{metric}"
                          )

          promotion = bool(
              report[
                  "promotionCandidate"
              ]
          )

          challenger_path = Path(
              "model/automl-challenger.json"
          )

          if promotion:
              if not challenger_path.exists():
                  raise SystemExit(
                      "promotion candidate "
                      "without challenger file"
                  )

              challenger = json.loads(
                  challenger_path.read_text(
                      encoding="utf-8"
                  )
              )

              if (
                  challenger.get(
                      "productionPromoted"
                  )
                  is not False
              ):
                  raise SystemExit(
                      "AutoML must not "
                      "directly promote production"
                  )

          print(
              json.dumps(
                  {
                      "version":
                          report["version"],

                      "candidateCount":
                          report["candidateCount"],

                      "finalistCount":
                          report["finalistCount"],

                      "bestFeatures":
                          best["features"],

                      "promotionCandidate":
                          promotion,

                      "latest":
                          best["latest"],

                      "replication":
                          best["replication"],

                      "productionChanged":
                          False,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      # ==========================================================
      # 5. GitHub Step Summary
      # ==========================================================

      - name: Create AutoML summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "model/automl-search.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          best = report["best"]
          base = report["baseline"]

          def pct(value):
              return f"{value * 100:.2f}%"

          lines = [
              "# BOAT RACE AI AutoML",
              "",
              f"Candidates: "
              f"{report['candidateCount']}",
              "",
              f"Finalists: "
              f"{report['finalistCount']}",
              "",
              "## Best Features",
              "",
              (
                  ", ".join(
                      best["features"]
                  )
                  or
                  "BASELINE"
              ),
              "",
              "## Latest OOS",
              "",
              "| Metric | Baseline | Best |",
              "|---|---:|---:|",
              (
                  f"| Winner Top1 | "
                  f"{pct(base['latest']['winnerTop1'])} | "
                  f"{pct(best['latest']['winnerTop1'])} |"
              ),
              (
                  f"| Winner Top3 | "
                  f"{pct(base['latest']['winnerTop3'])} | "
                  f"{pct(best['latest']['winnerTop3'])} |"
              ),
              (
                  f"| Trifecta Top3 | "
                  f"{pct(base['latest']['trifectaTop3'])} | "
                  f"{pct(best['latest']['trifectaTop3'])} |"
              ),
              (
                  f"| Trifecta Top5 | "
                  f"{pct(base['latest']['trifectaTop5'])} | "
                  f"{pct(best['latest']['trifectaTop5'])} |"
              ),
              (
                  f"| Log Loss | "
                  f"{base['latest']['logLoss']:.5f} | "
                  f"{best['latest']['logLoss']:.5f} |"
              ),
              (
                  f"| Brier | "
                  f"{base['latest']['brier']:.5f} | "
                  f"{best['latest']['brier']:.5f} |"
              ),
              "",
              "## Replication OOS",
              "",
              "| Metric | Baseline | Best |",
              "|---|---:|---:|",
              (
                  f"| Winner Top1 | "
                  f"{pct(base['replication']['winnerTop1'])} | "
                  f"{pct(best['replication']['winnerTop1'])} |"
              ),
              (
                  f"| Winner Top3 | "
                  f"{pct(base['replication']['winnerTop3'])} | "
                  f"{pct(best['replication']['winnerTop3'])} |"
              ),
              (
                  f"| Trifecta Top3 | "
                  f"{pct(base['replication']['trifectaTop3'])} | "
                  f"{pct(best['replication']['trifectaTop3'])} |"
              ),
              (
                  f"| Trifecta Top5 | "
                  f"{pct(base['replication']['trifectaTop5'])} | "
                  f"{pct(best['replication']['trifectaTop5'])} |"
              ),
              "",
              "## Decision",
              "",
              (
                  "PROMOTION CANDIDATE"
                  if report["promotionCandidate"]
                  else
                  "KEEP CURRENT CHAMPION"
              ),
              "",
              "**Production model is NOT automatically changed.**",
          ]

          with open(
              Path(
                  __import__("os").environ[
                      "GITHUB_STEP_SUMMARY"
                  ]
              ),
              "a",
              encoding="utf-8",
          ) as f:
              f.write(
                  "\n".join(lines)
              )
          PY

      # ==========================================================
      # 6. Persist AutoML state
      #
      # Production model/model.jsonは
      # 絶対にgit addしない。
      # ==========================================================

      - name: Commit AutoML results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add model/automl-search.json

          if [ -f model/automl-challenger.json ]; then
            git add model/automl-challenger.json
          fi

          if git diff --cached --quiet; then
            echo "No AutoML changes"
            exit 0
          fi

          git commit -m "chore: update AutoML challenger search"
          git push

      # ==========================================================
      # 7. Production safety
      # ==========================================================

      - name: Production safety confirmation
        run: |
          echo "AutoML completed."
          echo "Production model/model.json was NOT promoted."
