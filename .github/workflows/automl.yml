name: BOAT RACE AI Autonomous Improvement

on:
  workflow_dispatch:
    inputs:
      candidates:
        description: "Number of AutoML candidates"
        required: false
        default: "64"

      top_k:
        description: "OOS finalists"
        required: false
        default: "8"

  schedule:
    # Every Monday 03:30 JST
    - cron: "30 18 * * 0"

permissions:
  contents: write

concurrency:
  group: boat-race-ai-autonomous-improvement
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Resolve configuration
        id: config
        shell: bash
        run: |
          CANDIDATES="${{ github.event.inputs.candidates }}"
          TOP_K="${{ github.event.inputs.top_k }}"

          if [ -z "$CANDIDATES" ]; then
            CANDIDATES="64"
          fi

          if [ -z "$TOP_K" ]; then
            TOP_K="8"
          fi

          if ! [[ "$CANDIDATES" =~ ^[0-9]+$ ]]; then
            exit 1
          fi

          if ! [[ "$TOP_K" =~ ^[0-9]+$ ]]; then
            exit 1
          fi

          if [ "$CANDIDATES" -lt 2 ]; then
            CANDIDATES="2"
          fi

          if [ "$CANDIDATES" -gt 96 ]; then
            CANDIDATES="96"
          fi

          if [ "$TOP_K" -lt 2 ]; then
            TOP_K="2"
          fi

          if [ "$TOP_K" -gt 10 ]; then
            TOP_K="10"
          fi

          echo "candidates=$CANDIDATES" >> "$GITHUB_OUTPUT"
          echo "top_k=$TOP_K" >> "$GITHUB_OUTPUT"

      - name: Syntax checks
        run: |
          python -m py_compile training/experiment_v10_features.py
          python -m py_compile training/automl_search.py
          python -m py_compile training/auto_cycle.py
          node --check api/before.js

      - name: Run AutoML search
        run: |
          python training/automl_search.py \
            --train-days 120 \
            --validation-days 15 \
            --test-days 30 \
            --replication-shift 45 \
            --max-candidates "${{ steps.config.outputs.candidates }}" \
            --top-k "${{ steps.config.outputs.top_k }}" \
            --output model/automl-search.json \
            --challenger model/automl-challenger.json

      - name: Compare against current Champion
        run: |
          python training/auto_cycle.py \
            --report model/automl-search.json \
            --champion model/model.json \
            --challenger model/automl-challenger.json \
            --backup model/model.previous.json \
            --manifest model/production-manifest.json \
            --cycle-report model/auto-cycle.json \
            --index index.html

      - name: Read cycle state
        id: cycle
        run: |
          PROMOTED=$(python -c "import json; print(str(json.load(open('model/auto-cycle.json'))['promoted']).lower())")
          ACTIVE=$(python -c "import json; d=json.load(open('model/auto-cycle.json')); print(d.get('newChampion',''))")

          echo "promoted=$PROMOTED" >> "$GITHUB_OUTPUT"
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"

          echo "Promoted: $PROMOTED"
          echo "Active candidate: $ACTIVE"

      - name: Validate promoted runtime
        if: steps.cycle.outputs.promoted == 'true'
        run: |
          node --check api/before.js

          python -c "import re,pathlib; h=pathlib.Path('index.html').read_text(encoding='utf-8'); s=re.findall(r'<script>([\\s\\S]*?)</script>',h,re.I); assert s; pathlib.Path('/tmp/app.js').write_text('\\n'.join(s),encoding='utf-8')"

          node --check /tmp/app.js

          python -c "import json; m=json.load(open('model/model.json')); n=len(m['features']); assert 15 <= n <= 21; assert len(m['mean'])==n; assert len(m['scale'])==n; assert len(m['coefficients'])==n; assert m['liveFeatureMode']=='race-relative'"

          test -f model/model.previous.json
          test -f model/production-manifest.json

      - name: Commit AutoML state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            model/automl-search.json \
            model/auto-cycle.json

          if [ -f model/automl-challenger.json ]; then
            git add model/automl-challenger.json
          fi

          if [ "${{ steps.cycle.outputs.promoted }}" = "true" ]; then
            git add \
              index.html \
              api/before.js \
              model/model.json \
              model/model.previous.json \
              model/production-manifest.json
          fi

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          if [ "${{ steps.cycle.outputs.promoted }}" = "true" ]; then
            git commit -m "feat: automatically promote stronger Champion"
          else
            git commit -m "chore: update weekly AutoML evaluation"
          fi

          git push

      - name: Wait for Vercel
        if: steps.cycle.outputs.promoted == 'true'
        run: |
          sleep 30

      - name: Production smoke test
        id: smoke
        if: steps.cycle.outputs.promoted == 'true'
        continue-on-error: true
        run: |
          SUCCESS=0

          EXPECTED="${{ steps.cycle.outputs.active }}"

          for i in $(seq 1 18); do

            TS=$(date +%s)

            if curl \
              --fail \
              --silent \
              --show-error \
              "https://boat-race-ai-app.vercel.app/model/model.json?v=$TS" \
              -o /tmp/live-model.json
            then

              if EXPECTED="$EXPECTED" python -c "import json,os; m=json.load(open('/tmp/live-model.json')); assert m.get('version')==os.environ['EXPECTED']; assert 15 <= len(m.get('features',[])) <= 21"
              then

                if curl \
                  --fail \
                  --silent \
                  --show-error \
                  "https://boat-race-ai-app.vercel.app/?v=$TS" \
                  | grep -q "raceRelativeLiveMaps"
                then
                  SUCCESS=1
                  break
                fi

              fi

            fi

            sleep 10

          done

          if [ "$SUCCESS" -ne 1 ]; then
            exit 1
          fi

      - name: Automatic rollback
        if: steps.cycle.outputs.promoted == 'true' && steps.smoke.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git revert --no-edit HEAD
          git push

          echo "Automatic rollback completed."

          exit 1

      - name: Final state
        run: |
          if [ "${{ steps.cycle.outputs.promoted }}" = "true" ]; then
            echo "A stronger Champion was promoted automatically."
          else
            echo "Current Champion remains active."
          fi
