name: BOAT RACE AI Fix Trifecta Odds Key

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fix production odds key
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("api/odds.js")

          text = path.read_text(
              encoding="utf-8"
          )

          old = """odds[
      `${combo[0]}-${combo[1]}-${combo[2]}`
    ]=
      odd;"""

          new = """odds[
      combo
    ]=
      odd;"""

          if old not in text:
              raise SystemExit(
                  "Expected trifecta odds code not found"
              )

          text = text.replace(
              old,
              new,
              1,
          )

          path.write_text(
              text,
              encoding="utf-8",
          )
          PY

      - name: Fix installer source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "training/install_multibet.py"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          old = """odds[
      `${combo[0]}-${combo[1]}-${combo[2]}`
    ]=
      odd;"""

          new = """odds[
      combo
    ]=
      odd;"""

          if old in text:
              text = text.replace(
                  old,
                  new,
                  1,
              )

              path.write_text(
                  text,
                  encoding="utf-8",
              )
          PY

      - name: Validate API
        run: |
          node --check api/odds.js

          grep -q "odds\\[" api/odds.js

          if grep -q '\${combo\[0\]}-\${combo\[1\]}-\${combo\[2\]}' api/odds.js; then
            echo "Old trifecta key still exists"
            exit 1
          fi

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            api/odds.js \
            training/install_multibet.py

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "fix: align trifecta model and odds keys"
          git push

      - name: Wait for Vercel
        run: |
          sleep 30

      - name: Production smoke test
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            "https://boat-race-ai-app.vercel.app/api/odds?date=2026-08-31&venue=12&race=1" \
            -o /tmp/odds.json || true

          echo "Trifecta key fix deployed."
