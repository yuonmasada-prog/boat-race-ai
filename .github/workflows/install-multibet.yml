name: BOAT RACE AI Install MultiBet

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-race-ai-multibet-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check installer
        run: |
          python -m py_compile training/install_multibet.py

      - name: Install MultiBet
        run: |
          python training/install_multibet.py

      - name: Validate API
        run: |
          node --check api/odds.js

      - name: Validate frontend JavaScript
        run: |
          python -c "import re,pathlib; h=pathlib.Path('index.html').read_text(encoding='utf-8'); s=re.findall(r'<script>([\\s\\S]*?)</script>',h,re.I); assert s; pathlib.Path('/tmp/app.js').write_text('\\n'.join(s),encoding='utf-8')"

          node --check /tmp/app.js

      - name: Validate MultiBet runtime
        run: |
          python -c "from pathlib import Path; h=Path('index.html').read_text(encoding='utf-8'); assert 'aggregateBetProbabilities' in h; assert 'multiBetRecommendation' in h; assert 'chooseMultiBets' in h; assert '券種別AI予想' in h"

          grep -q "odds3f" api/odds.js
          grep -q "odds2t" api/odds.js
          grep -q "odds2f" api/odds.js

      - name: Commit MultiBet production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            api/odds.js \
            index.html

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "feat: enable multi-bet race strategy"
          git push

      - name: Wait for Vercel
        run: |
          sleep 30

      - name: Production smoke test
        id: smoke
        continue-on-error: true
        run: |
          SUCCESS=0

          for i in $(seq 1 12); do

            TS=$(date +%s)

            if curl \
              --fail \
              --silent \
              --show-error \
              "https://boat-race-ai-app.vercel.app/?v=$TS" \
              -o /tmp/index.html
            then

              if grep -q "券種別AI予想" /tmp/index.html
              then
                SUCCESS=1
                break
              fi

            fi

            sleep 10

          done

          if [ "$SUCCESS" -ne 1 ]; then
            exit 1
          fi

      - name: Automatic rollback
        if: steps.smoke.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git revert --no-edit HEAD
          git push

          exit 1

      - name: Success
        if: steps.smoke.outcome == 'success'
        run: |
          echo "MultiBet strategy is live."
