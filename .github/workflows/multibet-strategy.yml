name: BOAT RACE AI MultiBet OOS

on:
  workflow_dispatch:

  schedule:
    # Every Tuesday 03:30 JST
    - cron: "30 18 * * 1"

permissions:
  contents: read

concurrency:
  group: boat-race-ai-multibet-oos
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture unchanged serving state
        run: python training/candidate_artifacts.py capture --kind multibet --directory candidate-output/multibet

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Syntax checks
        run: |
          python -m py_compile training/experiment_v10_features.py
          python -m py_compile training/multibet_strategy_oos.py

      - name: Run MultiBet OOS optimizer
        run: |
          python training/multibet_strategy_oos.py \
            --days 30 \
            --validation-days 15 \
            --min-validation-bets 80 \
            --min-test-bets 80 \
            --model model/model.json \
            --output candidate-output/multibet/multibet-strategy-oos.json \
            --strategy candidate-output/multibet/multibet-strategy.json

      - name: Validate report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "candidate-output/multibet/multibet-strategy-oos.json"
          )

          assert path.exists()

          report = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          assert (
              report["productionChanged"]
              is False
          )

          assert (
              report["methodology"]["selection"]
              ==
              "validation-only"
          )

          assert (
              report["methodology"]["test"]
              ==
              "frozen-after-selection"
          )

          best = report["best"]

          assert best["betType"] in {
              "trifecta",
              "trio",
              "exacta",
              "quinella",
          }

          assert (
              best["test"]["stake"]
              >= 0
          )

          assert (
              best["test"]["return"]
              >= 0
          )

          print(
              json.dumps(
                  {
                      "betType":
                          best["betType"],

                      "validationROI":
                          best[
                              "validation"
                          ][
                              "roi"
                          ],

                      "testROI":
                          best[
                              "test"
                          ][
                              "roi"
                          ],

                      "testHits":
                          best[
                              "test"
                          ][
                              "hits"
                          ],

                      "testTickets":
                          best[
                              "test"
                          ][
                              "tickets"
                          ],

                      "promotionCandidate":
                          report[
                              "promotionCandidate"
                          ],
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      - name: Read promotion state
        id: strategy
        run: |
          PROMOTION=$(python -c "import json; print(str(json.load(open('candidate-output/multibet/multibet-strategy-oos.json'))['promotionCandidate']).lower())")

          echo "promotion=$PROMOTION" >> "$GITHUB_OUTPUT"

          echo "Promotion candidate: $PROMOTION"

      - name: Validate challenger
        if: steps.strategy.outputs.promotion == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "candidate-output/multibet/multibet-strategy.json"
          )

          assert path.exists()

          strategy = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          assert (
              strategy["status"]
              ==
              "oos-positive-challenger"
          )

          assert (
              strategy["productionPromoted"]
              is False
          )

          assert (
              strategy["test"]["roi"]
              >=
              100.0
          )

          assert (
              strategy["test"]["profit"]
              >
              0
          )
          PY

      - name: Verify and seal candidate bundle
        id: seal
        run: python training/candidate_artifacts.py seal --kind multibet --directory candidate-output/multibet

      # This artifact is review material only. No workflow publishes or promotes it.
      - name: Save candidate bundle
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: multibet-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-output/multibet/
          if-no-files-found: error
          retention-days: 14
          overwrite: false

      - name: Save incomplete research for diagnosis
        if: failure() && steps.seal.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: multibet-INCOMPLETE-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-output/multibet/
          if-no-files-found: warn
          retention-days: 7
          overwrite: false
