name: BOAT RACE AI Promote v11

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-race-ai-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preflight
        run: |
          set -e
          python -m py_compile training/promote_automl.py
          node --check api/before.js
          test -f model/automl-search.json
          test -f model/automl-challenger.json
          test -f model/model.json

      - name: Build v11 production
        run: |
          set -e

          python training/promote_automl.py \
            --report model/automl-search.json \
            --challenger model/automl-challenger.json \
            --production model/model.json \
            --backup model/model.previous.json \
            --manifest model/production-manifest.json \
            --index index.html \
            --before api/before.js

      - name: Validate API JavaScript
        run: |
          set -e
          node --check api/before.js

      - name: Validate frontend JavaScript
        run: |
          set -e

          python -c "import re,pathlib; h=pathlib.Path('index.html').read_text(encoding='utf-8'); s=re.findall(r'<script>([\\s\\S]*?)</script>',h,re.I); pathlib.Path('/tmp/app.js').write_text('\\n'.join(s),encoding='utf-8'); assert s"

          node --check /tmp/app.js

      - name: Validate model contract
        run: |
          set -e

          python -c "import json; m=json.load(open('model/model.json')); n=len(m['features']); assert n==18; assert len(m['mean'])==n; assert len(m['scale'])==n; assert len(m['coefficients'])==n; assert {'ex_time_rel','weight_rel','ex_flying'}.issubset(set(m['features'])); assert m['liveFeatureMode']=='race-relative'"

      - name: Validate rollback
        run: |
          set -e
          test -f model/model.previous.json
          test -f model/production-manifest.json

      - name: Commit production
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            index.html \
            api/before.js \
            model/model.json \
            model/model.previous.json \
            model/production-manifest.json

          if git diff --cached --quiet; then
            echo "No production changes"
            exit 0
          fi

          git commit -m "feat: promote AutoML v11 to production"
          git push

      - name: Wait for Vercel
        run: |
          sleep 30

      - name: Production smoke test
        id: smoke
        continue-on-error: true
        run: |
          set -e

          SUCCESS=0

          for i in $(seq 1 18); do

            TS=$(date +%s)

            if curl \
              --fail \
              --silent \
              --show-error \
              "https://boat-race-ai-app.vercel.app/model/model.json?v=$TS" \
              -o /tmp/model.json
            then

              if python -c "import json; m=json.load(open('/tmp/model.json')); assert m.get('version')=='v11-automl-challenger'; assert len(m.get('features',[]))==18"
              then

                if curl \
                  --fail \
                  --silent \
                  --show-error \
                  "https://boat-race-ai-app.vercel.app/?v=$TS" \
                  | grep -q "v11"
                then
                  SUCCESS=1
                  break
                fi

              fi

            fi

            sleep 10

          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "Production smoke test failed"
            exit 1
          fi

          echo "Production v11 smoke test passed"

      - name: Automatic rollback
        if: steps.smoke.outcome == 'failure'
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git revert --no-edit HEAD
          git push

          echo "v11 was automatically rolled back."

          exit 1

      - name: Success
        if: steps.smoke.outcome == 'success'
        run: |
          echo "BOAT RACE AI v11 is live."
          echo "Rollback protection is enabled."
