name: Train BOAT RACE AI v8.1

on:
  workflow_dispatch:

  schedule:
    # 毎日 18:30 JST
    - cron: "30 9 * * *"

permissions:
  contents: write

concurrency:
  group: boat-race-ai-v8-1-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Syntax check
        run: |
          python -m py_compile training/train_model.py
          python -m py_compile training/backtest_trifecta.py

      - name: Real-data smoke test
        run: |
          python training/train_model.py --smoke-test

      # ==========================================================
      # 1. 検証専用モデル
      # 直近30日を一切見せずに学習する
      # ==========================================================

      - name: Train held-out evaluation model
        run: |
          python training/train_model.py \
            --days 120 \
            --end-offset 30 \
            --output model/eval-model.json \
            --min-races 500 \
            --epochs 300 \
            --lr 0.035 \
            --l2 0.002 \
            --workers 4

      - name: Validate held-out model dates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import date, timedelta

          path = Path("model/eval-model.json")

          if not path.exists():
              raise SystemExit(
                  "eval-model.json was not generated"
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          required = [
              "version",
              "trainedAt",
              "lookbackDays",
              "endOffsetDays",
              "dataStartDate",
              "dataEndDate",
              "raceCount",
              "trainRaceCount",
              "validationRaceCount",
              "features",
              "mean",
              "scale",
              "coefficients",
              "training",
              "validation",
          ]

          missing = [
              key
              for key in required
              if key not in data
          ]

          if missing:
              raise SystemExit(
                  f"missing keys: {missing}"
              )

          if data["endOffsetDays"] < 30:
              raise SystemExit(
                  "held-out model does not exclude 30 days"
              )

          model_end = date.fromisoformat(
              data["dataEndDate"]
          )

          test_start = (
              date.today()
              - timedelta(days=30)
          )

          if model_end >= test_start:
              raise SystemExit(
                  f"DATA LEAKAGE: model end={model_end}, "
                  f"test start={test_start}"
              )

          if data["raceCount"] < 500:
              raise SystemExit(
                  "too few evaluation training races"
              )

          print(
              "HELD-OUT MODEL DATE CHECK PASSED"
          )

          print(
              json.dumps(
                  {
                      "version":
                          data["version"],
                      "dataStartDate":
                          data["dataStartDate"],
                      "dataEndDate":
                          data["dataEndDate"],
                      "endOffsetDays":
                          data["endOffsetDays"],
                      "raceCount":
                          data["raceCount"],
                      "validation":
                          data["validation"],
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      # ==========================================================
      # 2. 完全未学習30日で3連単＋オッズ検証
      # ==========================================================

      - name: Run true held-out trifecta backtest
        run: |
          python training/backtest_trifecta.py \
            --days 30 \
            --min-races 500 \
            --model model/eval-model.json \
            --output model/backtest.json

      - name: Validate held-out backtest
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          from datetime import date

          path = Path("model/backtest.json")

          if not path.exists():
              raise SystemExit(
                  "model/backtest.json was not generated"
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          required = [
              "version",
              "modelVersion",
              "modelDataStartDate",
              "modelDataEndDate",
              "testStartDate",
              "testEndDate",
              "days",
              "raceCount",
              "oddsCoverage",
              "top1",
              "top3",
              "top5",
              "bestValueStrategy",
              "strategySearch",
              "byVenue",
          ]

          missing = [
              key
              for key in required
              if key not in data
          ]

          if missing:
              raise SystemExit(
                  f"backtest missing keys: {missing}"
              )

          model_end = date.fromisoformat(
              data["modelDataEndDate"]
          )

          test_start = date.fromisoformat(
              data["testStartDate"]
          )

          if model_end >= test_start:
              raise SystemExit(
                  "BACKTEST DATA LEAKAGE DETECTED"
              )

          if data["raceCount"] < 500:
              raise SystemExit(
                  "too few held-out test races"
              )

          odds_coverage = float(
              data["oddsCoverage"]
          )

          if not math.isfinite(
              odds_coverage
          ):
              raise SystemExit(
                  "invalid odds coverage"
              )

          for section in (
              "top1",
              "top3",
              "top5",
          ):
              result = data[section]

              for metric in (
                  "hitRate",
                  "roi",
              ):
                  value = result.get(
                      metric
                  )

                  if value is None:
                      raise SystemExit(
                          f"{section}: missing {metric}"
                      )

                  if not math.isfinite(
                      float(value)
                  ):
                      raise SystemExit(
                          f"{section}: invalid {metric}"
                      )

          print(
              "TRUE HELD-OUT BACKTEST PASSED"
          )

          print(
              json.dumps(
                  {
                      "modelDataEndDate":
                          data["modelDataEndDate"],
                      "testStartDate":
                          data["testStartDate"],
                      "testEndDate":
                          data["testEndDate"],
                      "raceCount":
                          data["raceCount"],
                      "oddsCoverage":
                          data["oddsCoverage"],
                      "top1":
                          data["top1"],
                      "top3":
                          data["top3"],
                      "top5":
                          data["top5"],
                      "bestValueStrategy":
                          data["bestValueStrategy"],
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      # ==========================================================
      # 3. 本番用モデル
      # 検証終了後、最新120日ですべて再学習
      # ==========================================================

      - name: Train latest production model
        run: |
          python training/train_model.py \
            --days 120 \
            --end-offset 0 \
            --output model/model.json \
            --min-races 500 \
            --epochs 300 \
            --lr 0.035 \
            --l2 0.002 \
            --workers 4

      - name: Validate production model
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = Path("model/model.json")

          if not path.exists():
              raise SystemExit(
                  "model/model.json was not generated"
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          required = [
              "version",
              "trainedAt",
              "lookbackDays",
              "endOffsetDays",
              "dataStartDate",
              "dataEndDate",
              "raceCount",
              "trainRaceCount",
              "validationRaceCount",
              "features",
              "mean",
              "scale",
              "coefficients",
              "training",
              "validation",
          ]

          missing = [
              key
              for key in required
              if key not in data
          ]

          if missing:
              raise SystemExit(
                  f"production model missing: {missing}"
              )

          if data["endOffsetDays"] != 0:
              raise SystemExit(
                  "production model is not latest"
              )

          feature_count = len(
              data["features"]
          )

          for key in (
              "mean",
              "scale",
              "coefficients",
          ):
              if len(data[key]) != feature_count:
                  raise SystemExit(
                      f"{key} length mismatch"
                  )

          for coefficient in data[
              "coefficients"
          ]:
              if not math.isfinite(
                  float(coefficient)
              ):
                  raise SystemExit(
                      "invalid coefficient"
                  )

          print(
              "PRODUCTION MODEL PASSED"
          )

          print(
              json.dumps(
                  {
                      "version":
                          data["version"],
                      "dataStartDate":
                          data["dataStartDate"],
                      "dataEndDate":
                          data["dataEndDate"],
                      "raceCount":
                          data["raceCount"],
                      "validation":
                          data["validation"],
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      # ==========================================================
      # 4. 保存
      # eval-modelは検証専用なのでGitHubには残さない
      # ==========================================================

      - name: Commit production model and backtest
        run: |
          git config \
            user.name \
            "boat-race-ai-bot"

          git config \
            user.email \
            "boat-race-ai-bot@users.noreply.github.com"

          git add \
            model/model.json \
            model/backtest.json

          if git diff \
            --cached \
            --quiet
          then
            echo "No model changes."
            exit 0
          fi

          git commit \
            -m "chore: retrain BOAT RACE AI v8.1"

          git push \
            origin \
            HEAD:main
