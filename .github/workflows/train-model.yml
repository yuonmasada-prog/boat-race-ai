name: Train BOAT RACE AI v9

on:
  workflow_dispatch:

  schedule:
    # 毎日 18:30 JST
    - cron: "30 9 * * *"

permissions:
  contents: write

concurrency:
  group: boat-race-ai-v9-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      # ==========================================================
      # 0. コード自体の検査
      # ==========================================================

      - name: Syntax check
        run: |
          python -m py_compile training/train_model.py
          python -m py_compile training/backtest_trifecta.py

      - name: Real-data smoke test
        run: |
          python training/train_model.py --smoke-test

      # ==========================================================
      # 1. 評価専用モデル
      #
      # 最新45日間を一切学習させない。
      #
      # 45日の内訳:
      #   最初15日 = strategy validation
      #   最後30日 = frozen final test
      # ==========================================================

      - name: Train strict evaluation model
        run: |
          python training/train_model.py \
            --mode evaluation \
            --days 120 \
            --holdout-days 45 \
            --end-offset 45 \
            --output model/eval-model.json \
            --min-races 500 \
            --epochs 300 \
            --lr 0.035 \
            --l2 0.002 \
            --workers 4

      - name: Validate evaluation model isolation
        run: |
          python - <<'PY'
          import json
          from datetime import date, timedelta
          from pathlib import Path

          path = Path("model/eval-model.json")

          if not path.exists():
              raise SystemExit(
                  "eval-model.json was not generated"
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          required = [
              "version",
              "mode",
              "trainedAt",
              "lookbackDays",
              "endOffsetDays",
              "dataStartDate",
              "dataEndDate",
              "raceCount",
              "trainRaceCount",
              "validationRaceCount",
              "features",
              "mean",
              "scale",
              "coefficients",
              "training",
              "validation",
              "externalHoldout",
          ]

          missing = [
              key
              for key in required
              if key not in data
          ]

          if missing:
              raise SystemExit(
                  f"missing model keys: {missing}"
              )

          if data["mode"] != "evaluation":
              raise SystemExit(
                  "evaluation model has wrong mode"
              )

          if int(data["endOffsetDays"]) < 45:
              raise SystemExit(
                  "evaluation model does not reserve 45 days"
              )

          model_end = date.fromisoformat(
              data["dataEndDate"]
          )

          validation_start = (
              date.today()
              - timedelta(days=45)
          )

          if model_end >= validation_start:
              raise SystemExit(
                  "DATA LEAKAGE DETECTED: "
                  f"model_end={model_end}, "
                  f"validation_start={validation_start}"
              )

          if int(data["raceCount"]) < 500:
              raise SystemExit(
                  "too few evaluation training races"
              )

          feature_count = len(
              data["features"]
          )

          for key in (
              "mean",
              "scale",
              "coefficients",
          ):
              if len(data[key]) != feature_count:
                  raise SystemExit(
                      f"{key} length mismatch"
                  )

          print(
              "EVALUATION MODEL ISOLATION PASSED"
          )

          print(
              json.dumps(
                  {
                      "version":
                          data["version"],
                      "dataStartDate":
                          data["dataStartDate"],
                      "dataEndDate":
                          data["dataEndDate"],
                      "endOffsetDays":
                          data["endOffsetDays"],
                      "raceCount":
                          data["raceCount"],
                      "internalValidation":
                          data["validation"],
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      # ==========================================================
      # 2. 外部45日バックテスト
      #
      # validation 15日だけで戦略を選択。
      # final test 30日には選択済み戦略を固定して適用。
      #
      # 3連単オッズ列は120通りを厳密解析。
      # ==========================================================

      - name: Run strict 45-day trifecta backtest
        run: |
          python training/backtest_trifecta.py \
            --validation-days 15 \
            --test-days 30 \
            --min-races 500 \
            --model model/eval-model.json \
            --output model/backtest.json

      # ==========================================================
      # 3. バックテスト結果の完全性検査
      # ==========================================================

      - name: Validate strict backtest
        run: |
          python - <<'PY'
          import json
          import math
          from datetime import date
          from pathlib import Path

          path = Path("model/backtest.json")

          if not path.exists():
              raise SystemExit(
                  "model/backtest.json was not generated"
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          required = [
              "version",
              "method",
              "modelVersion",
              "modelDataStartDate",
              "modelDataEndDate",
              "validation",
              "finalTest",
              "strategySearchValidationOnly",
              "oddsParser",
          ]

          missing = [
              key
              for key in required
              if key not in data
          ]

          if missing:
              raise SystemExit(
                  f"backtest missing keys: {missing}"
              )

          validation = data["validation"]
          final_test = data["finalTest"]
          parser = data["oddsParser"]

          if int(validation["days"]) != 15:
              raise SystemExit(
                  "validation period is not 15 days"
              )

          if int(final_test["days"]) != 30:
              raise SystemExit(
                  "final test period is not 30 days"
              )

          model_end = date.fromisoformat(
              data["modelDataEndDate"]
          )

          validation_start = date.fromisoformat(
              validation["startDate"]
          )

          final_start = date.fromisoformat(
              final_test["startDate"]
          )

          if model_end >= validation_start:
              raise SystemExit(
                  "BACKTEST MODEL DATA LEAKAGE"
              )

          validation_end = date.fromisoformat(
              validation["endDate"]
          )

          if validation_end >= final_start:
              raise SystemExit(
                  "validation overlaps final test"
              )

          if int(validation["raceCount"]) < 500:
              raise SystemExit(
                  "too few validation races"
              )

          if int(final_test["raceCount"]) < 500:
              raise SystemExit(
                  "too few final-test races"
              )

          if int(parser["expectedColumns"]) != 120:
              raise SystemExit(
                  "trifecta parser does not expect 120 columns"
              )

          if parser["fallbackByNumericPosition"] is not False:
              raise SystemExit(
                  "unsafe odds fallback is enabled"
              )

          for section_name, section in (
              ("validation", validation),
              ("finalTest", final_test),
          ):
              coverage = float(
                  section["strictOddsCoverage"]
              )

              if not math.isfinite(coverage):
                  raise SystemExit(
                      f"{section_name}: invalid odds coverage"
                  )

              if coverage < 0 or coverage > 1:
                  raise SystemExit(
                      f"{section_name}: odds coverage out of range"
                  )

          frozen = final_test.get(
              "frozenStrategyResult"
          )

          if frozen is None:
              raise SystemExit(
                  "no validation-selected strategy "
                  "was frozen for final test"
              )

          for metric in (
              "hitRate",
              "roi",
              "stake",
              "return",
              "profit",
              "racesBet",
          ):
              if metric not in frozen:
                  raise SystemExit(
                      f"final strategy missing {metric}"
                  )

              value = float(
                  frozen[metric]
              )

              if not math.isfinite(value):
                  raise SystemExit(
                      f"invalid final {metric}"
                  )

          print(
              "STRICT 45-DAY BACKTEST PASSED"
          )

          print(
              json.dumps(
                  {
                      "version":
                          data["version"],

                      "modelDataEndDate":
                          data["modelDataEndDate"],

                      "validationPeriod":
                          (
                              validation["startDate"]
                              + " -> "
                              + validation["endDate"]
                          ),

                      "finalTestPeriod":
                          (
                              final_test["startDate"]
                              + " -> "
                              + final_test["endDate"]
                          ),

                      "validationRaces":
                          validation["raceCount"],

                      "finalTestRaces":
                          final_test["raceCount"],

                      "validationOddsCoverage":
                          validation["strictOddsCoverage"],

                      "finalOddsCoverage":
                          final_test["strictOddsCoverage"],

                      "frozenSettings":
                          final_test["frozenSettings"],

                      "finalFrozenResult":
                          frozen,

                      "finalModelOnlyTop1":
                          final_test[
                              "baseline"
                          ][
                              "modelOnly"
                          ][
                              "top1"
                          ],
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      # ==========================================================
      # 4. 本番モデル
      #
      # 外部検証が正常終了した後だけ実行。
      # 最新120日を使って再学習する。
      # ==========================================================

      - name: Train latest production model
        run: |
          python training/train_model.py \
            --mode production \
            --days 120 \
            --end-offset 0 \
            --output model/model.json \
            --min-races 500 \
            --epochs 300 \
            --lr 0.035 \
            --l2 0.002 \
            --workers 4

      # ==========================================================
      # 5. 本番モデル検査
      # ==========================================================

      - name: Validate production model
        run: |
          python - <<'PY'
          import json
          import math
          from datetime import date, timedelta
          from pathlib import Path

          path = Path("model/model.json")

          if not path.exists():
              raise SystemExit(
                  "model/model.json was not generated"
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          required = [
              "version",
              "mode",
              "trainedAt",
              "lookbackDays",
              "endOffsetDays",
              "dataStartDate",
              "dataEndDate",
              "raceCount",
              "trainRaceCount",
              "validationRaceCount",
              "features",
              "mean",
              "scale",
              "coefficients",
              "training",
              "validation",
          ]

          missing = [
              key
              for key in required
              if key not in data
          ]

          if missing:
              raise SystemExit(
                  f"production model missing: {missing}"
              )

          if data["mode"] != "production":
              raise SystemExit(
                  "production model has wrong mode"
              )

          if int(data["endOffsetDays"]) != 0:
              raise SystemExit(
                  "production model is not latest"
              )

          expected_latest = (
              date.today()
              - timedelta(days=1)
          )

          model_end = date.fromisoformat(
              data["dataEndDate"]
          )

          # データ提供側の更新遅延を考慮して
          # 最大2日遅れまでは許容。
          if (
              expected_latest - model_end
          ).days > 2:
              raise SystemExit(
                  "production model data is stale: "
                  f"{model_end}"
              )

          feature_count = len(
              data["features"]
          )

          for key in (
              "mean",
              "scale",
              "coefficients",
          ):
              if len(data[key]) != feature_count:
                  raise SystemExit(
                      f"{key} length mismatch"
                  )

          for coefficient in data["coefficients"]:
              if not math.isfinite(
                  float(coefficient)
              ):
                  raise SystemExit(
                      "invalid coefficient"
                  )

          print(
              "PRODUCTION MODEL PASSED"
          )

          print(
              json.dumps(
                  {
                      "version":
                          data["version"],
                      "mode":
                          data["mode"],
                      "dataStartDate":
                          data["dataStartDate"],
                      "dataEndDate":
                          data["dataEndDate"],
                      "raceCount":
                          data["raceCount"],
                      "internalValidation":
                          data["validation"],
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      # ==========================================================
      # 6. 評価モデルは一時ファイルなので削除
      # ==========================================================

      - name: Remove temporary evaluation model
        run: |
          rm -f model/eval-model.json

      # ==========================================================
      # 7. model.json + backtest.json をGitHubへ保存
      # ==========================================================

      - name: Commit v9 model and backtest
        run: |
          git config \
            user.name \
            "boat-race-ai-bot"

          git config \
            user.email \
            "boat-race-ai-bot@users.noreply.github.com"

          git add \
            model/model.json \
            model/backtest.json

          if git diff \
            --cached \
            --quiet
          then
            echo "No model changes."
            exit 0
          fi

          git commit \
            -m "chore: retrain BOAT RACE AI v9"

          git push \
            origin \
            HEAD:main
