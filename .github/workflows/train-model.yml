name: Train BOAT RACE AI v9.3

on:
  workflow_dispatch:

  schedule:
    # 毎日 18:30 JST
    - cron: "30 9 * * *"

permissions:
  contents: write

concurrency:
  group: boat-race-ai-v93-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      # ==========================================================
      # 0. コード検査
      # ==========================================================

      - name: Syntax check
        run: |
          python -m py_compile training/train_model.py
          python -m py_compile training/backtest_trifecta.py
          python -m py_compile training/backtest_v93.py

      - name: Real-data smoke test
        run: |
          python training/train_model.py --smoke-test

      # ==========================================================
      # 1. 評価専用モデル
      #
      # 最新45日を学習から完全隔離
      #
      # 15日 = validation
      # 30日 = final OOS test
      # ==========================================================

      - name: Train strict evaluation model
        run: |
          python training/train_model.py \
            --mode evaluation \
            --days 120 \
            --holdout-days 45 \
            --end-offset 45 \
            --output model/eval-model.json \
            --min-races 500 \
            --epochs 300 \
            --lr 0.035 \
            --l2 0.002 \
            --workers 4

      - name: Validate evaluation isolation
        run: |
          python - <<'PY'
          import json
          from datetime import date, timedelta
          from pathlib import Path

          path = Path("model/eval-model.json")

          if not path.exists():
              raise SystemExit("eval-model.json missing")

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          if data.get("mode") != "evaluation":
              raise SystemExit(
                  "evaluation model mode mismatch"
              )

          if int(data.get("endOffsetDays", 0)) < 45:
              raise SystemExit(
                  "45-day isolation is not active"
              )

          model_end = date.fromisoformat(
              data["dataEndDate"]
          )

          validation_start = (
              date.today()
              - timedelta(days=45)
          )

          if model_end >= validation_start:
              raise SystemExit(
                  "DATA LEAKAGE DETECTED: "
                  f"{model_end} >= "
                  f"{validation_start}"
              )

          if int(data["raceCount"]) < 500:
              raise SystemExit(
                  "too few evaluation races"
              )

          n = len(data["features"])

          for key in (
              "mean",
              "scale",
              "coefficients",
          ):
              if len(data[key]) != n:
                  raise SystemExit(
                      f"{key} dimension mismatch"
                  )

          print("EVALUATION ISOLATION PASSED")
          print(
              json.dumps(
                  {
                      "modelEnd":
                          data["dataEndDate"],
                      "raceCount":
                          data["raceCount"],
                      "features":
                          n,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      # ==========================================================
      # 2. v9.2 従来方式
      #
      # 比較対象として残す
      # ==========================================================

      - name: Run v9.2 reference backtest
        run: |
          python training/backtest_trifecta.py \
            --validation-days 15 \
            --test-days 30 \
            --min-races 500 \
            --model model/eval-model.json \
            --output model/backtest.json

      # ==========================================================
      # 3. v9.3
      #
      # 全レース予想
      # +
      # 0〜100購入スコア
      # +
      # 会場は弱い連続priorのみ
      # ==========================================================

      - name: Run v9.3 continuous-score backtest
        run: |
          python training/backtest_v93.py \
            --validation-days 15 \
            --test-days 30 \
            --min-races 500 \
            --model model/eval-model.json \
            --output model/backtest-v93.json

      # ==========================================================
      # 4. v9.3完全性検査
      # ==========================================================

      - name: Validate v9.3 backtest
        run: |
          python - <<'PY'
          import json
          import math
          from datetime import date
          from pathlib import Path

          path = Path("model/backtest-v93.json")

          if not path.exists():
              raise SystemExit(
                  "backtest-v93.json missing"
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          if (
              data.get("version")
              != "v9.3-continuous-purchase-score"
          ):
              raise SystemExit(
                  "wrong v9.3 backtest version"
              )

          design = data.get("design", {})

          if design.get("predictEveryRace") is not True:
              raise SystemExit(
                  "predictEveryRace must be true"
              )

          if design.get("predictWhenSkipped") is not True:
              raise SystemExit(
                  "skipped races must retain prediction"
              )

          if design.get("venueHardFilter") is not False:
              raise SystemExit(
                  "venue hard filtering must be disabled"
              )

          if (
              design.get("venueContinuousPrior")
              is not True
          ):
              raise SystemExit(
                  "venue continuous prior missing"
              )

          validation = data["validation"]
          final_test = data["finalTest"]

          if int(validation["days"]) != 15:
              raise SystemExit(
                  "validation must be 15 days"
              )

          if int(final_test["days"]) != 30:
              raise SystemExit(
                  "final test must be 30 days"
              )

          model_end = date.fromisoformat(
              data["modelDataEndDate"]
          )

          validation_start = date.fromisoformat(
              validation["startDate"]
          )

          if model_end >= validation_start:
              raise SystemExit(
                  "V9.3 DATA LEAKAGE"
              )

          validation_end = date.fromisoformat(
              validation["endDate"]
          )

          test_start = date.fromisoformat(
              final_test["startDate"]
          )

          if validation_end >= test_start:
              raise SystemExit(
                  "validation overlaps final test"
              )

          if int(validation["raceCount"]) < 500:
              raise SystemExit(
                  "too few validation races"
              )

          if int(final_test["raceCount"]) < 500:
              raise SystemExit(
                  "too few final test races"
              )

          strategy = data["frozenStrategy"]

          threshold = float(
              strategy["threshold"]
          )

          if threshold < 0 or threshold > 100:
              raise SystemExit(
                  "invalid purchase threshold"
              )

          final_purchase = final_test["purchase"]

          required_metrics = (
              "racesBet",
              "skippedRaces",
              "betRate",
              "skipRate",
              "hits",
              "hitRate",
              "stake",
              "return",
              "profit",
              "roi",
          )

          for metric in required_metrics:
              if metric not in final_purchase:
                  raise SystemExit(
                      f"missing metric: {metric}"
                  )

              value = float(
                  final_purchase[metric]
              )

              if not math.isfinite(value):
                  raise SystemExit(
                      f"invalid metric: {metric}"
                  )

          prediction = final_test["prediction"]

          for metric in (
              "top1HitRate",
              "top3HitRate",
              "top5HitRate",
          ):
              value = float(
                  prediction[metric]
              )

              if (
                  not math.isfinite(value)
                  or value < 0
                  or value > 1
              ):
                  raise SystemExit(
                      f"invalid prediction metric: "
                      f"{metric}"
                  )

          print("V9.3 BACKTEST PASSED")

          print(
              json.dumps(
                  {
                      "validationPeriod":
                          (
                              validation["startDate"]
                              + " -> "
                              + validation["endDate"]
                          ),

                      "finalTestPeriod":
                          (
                              final_test["startDate"]
                              + " -> "
                              + final_test["endDate"]
                          ),

                      "threshold":
                          strategy["threshold"],

                      "maxTickets":
                          strategy["maxTickets"],

                      "predictionAllRaces":
                          final_test["prediction"],

                      "purchase":
                          final_purchase,

                      "scoreDistribution":
                          final_test[
                              "scoreDistribution"
                          ],
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      # ==========================================================
      # 5. v9.2 vs v9.3 比較
      # ==========================================================

      - name: Compare v9.2 and v9.3
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          v92 = json.loads(
              Path(
                  "model/backtest.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          v93 = json.loads(
              Path(
                  "model/backtest-v93.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          old = (
              v92["finalTest"]
              ["frozenStrategyResult"]
          )

          new = (
              v93["finalTest"]
              ["purchase"]
          )

          comparison = {
              "v9.2": {
                  "racesBet":
                      old["racesBet"],
                  "hitRate":
                      old["hitRate"],
                  "roi":
                      old["roi"],
                  "profit":
                      old["profit"],
                  "stake":
                      old["stake"],
                  "return":
                      old["return"],
              },

              "v9.3": {
                  "racesBet":
                      new["racesBet"],
                  "hitRate":
                      new["hitRate"],
                  "roi":
                      new["roi"],
                  "profit":
                      new["profit"],
                  "stake":
                      new["stake"],
                  "return":
                      new["return"],
                  "skipRate":
                      new["skipRate"],
              },

              "roiChangePoints":
                  (
                      new["roi"]
                      - old["roi"]
                  ) * 100,

              "profitChange":
                  (
                      new["profit"]
                      - old["profit"]
                  ),
          }

          Path(
              "model/comparison-v93.json"
          ).write_text(
              json.dumps(
                  comparison,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          print("=== V9.2 VS V9.3 ===")
          print(
              json.dumps(
                  comparison,
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      # ==========================================================
      # 6. 最新120日で本番モデル再学習
      # ==========================================================

      - name: Train latest production model
        run: |
          python training/train_model.py \
            --mode production \
            --days 120 \
            --end-offset 0 \
            --output model/model.json \
            --min-races 500 \
            --epochs 300 \
            --lr 0.035 \
            --l2 0.002 \
            --workers 4

      # ==========================================================
      # 7. 本番モデル検査
      # ==========================================================

      - name: Validate production model
        run: |
          python - <<'PY'
          import json
          import math
          from datetime import date, timedelta
          from pathlib import Path

          path = Path("model/model.json")

          if not path.exists():
              raise SystemExit(
                  "model.json missing"
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          if data.get("mode") != "production":
              raise SystemExit(
                  "wrong production mode"
              )

          if int(data.get("endOffsetDays", -1)) != 0:
              raise SystemExit(
                  "production model is not latest"
              )

          expected_latest = (
              date.today()
              - timedelta(days=1)
          )

          model_end = date.fromisoformat(
              data["dataEndDate"]
          )

          if (
              expected_latest - model_end
          ).days > 2:
              raise SystemExit(
                  "production model is stale"
              )

          feature_count = len(
              data["features"]
          )

          for key in (
              "mean",
              "scale",
              "coefficients",
          ):
              if len(data[key]) != feature_count:
                  raise SystemExit(
                      f"{key} dimension mismatch"
                  )

          for coefficient in data["coefficients"]:
              if not math.isfinite(
                  float(coefficient)
              ):
                  raise SystemExit(
                      "invalid coefficient"
                  )

          print("PRODUCTION MODEL PASSED")

          print(
              json.dumps(
                  {
                      "version":
                          data["version"],
                      "dataStartDate":
                          data["dataStartDate"],
                      "dataEndDate":
                          data["dataEndDate"],
                      "raceCount":
                          data["raceCount"],
                      "validation":
                          data["validation"],
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      # ==========================================================
      # 8. 一時評価モデル削除
      # ==========================================================

      - name: Remove temporary evaluation model
        run: |
          rm -f model/eval-model.json

      # ==========================================================
      # 9. 結果をGitHubへ保存
      # ==========================================================

      - name: Commit v9.3 results
        run: |
          git config \
            user.name \
            "boat-race-ai-bot"

          git config \
            user.email \
            "boat-race-ai-bot@users.noreply.github.com"

          git add \
            model/model.json \
            model/backtest.json \
            model/backtest-v93.json \
            model/comparison-v93.json

          if git diff \
            --cached \
            --quiet
          then
            echo "No changes."
            exit 0
          fi

          git commit \
            -m "chore: evaluate BOAT RACE AI v9.3"

          git push \
            origin \
            HEAD:main
