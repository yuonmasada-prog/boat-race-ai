name: Train BOAT RACE AI v7

on:
  workflow_dispatch:

  schedule:
    # 毎日 18:30 JST
    # GitHub Actions cron は UTC
    - cron: "30 9 * * *"

permissions:
  contents: write

concurrency:
  group: boat-race-ai-v7-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Syntax check
        run: |
          python -m py_compile training/train_model.py

      - name: Train v7 model
        run: |
          python training/train_model.py \
            --days 120 \
            --min-races 500 \
            --epochs 300 \
            --lr 0.035 \
            --l2 0.002 \
            --workers 4

      - name: Validate model
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = Path("model/model.json")

          if not path.exists():
              raise SystemExit(
                  "model/model.json was not generated"
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          required = [
              "version",
              "trainedAt",
              "raceCount",
              "trainRaceCount",
              "validationRaceCount",
              "features",
              "mean",
              "scale",
              "coefficients",
              "training",
              "validation",
          ]

          missing = [
              key
              for key in required
              if key not in data
          ]

          if missing:
              raise SystemExit(
                  f"missing keys: {missing}"
              )

          feature_count = len(
              data["features"]
          )

          if feature_count == 0:
              raise SystemExit(
                  "feature list is empty"
              )

          for key in (
              "mean",
              "scale",
              "coefficients",
          ):
              if (
                  len(data[key])
                  !=
                  feature_count
              ):
                  raise SystemExit(
                      f"{key} length mismatch"
                  )

          if data["raceCount"] < 500:
              raise SystemExit(
                  "too few training races"
              )

          if data["validationRaceCount"] < 1:
              raise SystemExit(
                  "validation set is empty"
              )

          for value in data["coefficients"]:
              if not math.isfinite(
                  float(value)
              ):
                  raise SystemExit(
                      "non-finite coefficient detected"
                  )

          validation = data["validation"]

          for metric in (
              "top1Accuracy",
              "winnerInTop3",
              "logLoss",
              "brierScore",
          ):
              value = validation.get(
                  metric
              )

              if value is None:
                  raise SystemExit(
                      f"missing metric: {metric}"
                  )

              if not math.isfinite(
                  float(value)
              ):
                  raise SystemExit(
                      f"invalid metric: {metric}"
                  )

          print(
              json.dumps(
                  {
                      "version":
                          data["version"],

                      "trainedAt":
                          data["trainedAt"],

                      "raceCount":
                          data["raceCount"],

                      "trainRaceCount":
                          data["trainRaceCount"],

                      "validationRaceCount":
                          data[
                              "validationRaceCount"
                          ],

                      "validation":
                          validation,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      - name: Commit trained model
        run: |
          git config \
            user.name \
            "boat-race-ai-bot"

          git config \
            user.email \
            "boat-race-ai-bot@users.noreply.github.com"

          git add model/model.json

          if git diff \
            --cached \
            --quiet; then

            echo "Model did not change."
            exit 0
          fi

          git commit \
            -m "chore: retrain BOAT RACE AI v7"

          git push origin HEAD:main
