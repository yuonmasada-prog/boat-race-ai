name: Train BOAT RACE AI v8

on:
  workflow_dispatch:

  schedule:
    # 毎日 18:30 JST
    - cron: "30 9 * * *"

permissions:
  contents: write

concurrency:
  group: boat-race-ai-v8-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Syntax check
        run: |
          python -m py_compile training/train_model.py
          python -m py_compile training/backtest_trifecta.py

      - name: Real-data smoke test
        run: |
          python training/train_model.py --smoke-test

      - name: Train historical model
        run: |
          python training/train_model.py \
            --days 120 \
            --min-races 500 \
            --epochs 300 \
            --lr 0.035 \
            --l2 0.002 \
            --workers 4

      - name: Validate trained model
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = Path("model/model.json")

          if not path.exists():
              raise SystemExit(
                  "model/model.json was not generated"
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          required = [
              "version",
              "trainedAt",
              "raceCount",
              "trainRaceCount",
              "validationRaceCount",
              "features",
              "mean",
              "scale",
              "coefficients",
              "training",
              "validation",
          ]

          missing = [
              key
              for key in required
              if key not in data
          ]

          if missing:
              raise SystemExit(
                  f"missing keys: {missing}"
              )

          feature_count = len(
              data["features"]
          )

          if feature_count == 0:
              raise SystemExit(
                  "feature list is empty"
              )

          for key in (
              "mean",
              "scale",
              "coefficients",
          ):
              if (
                  len(data[key])
                  != feature_count
              ):
                  raise SystemExit(
                      f"{key} length mismatch"
                  )

          if data["raceCount"] < 500:
              raise SystemExit(
                  "too few training races"
              )

          if (
              data["validationRaceCount"]
              < 1
          ):
              raise SystemExit(
                  "validation set empty"
              )

          for coefficient in (
              data["coefficients"]
          ):
              if not math.isfinite(
                  float(coefficient)
              ):
                  raise SystemExit(
                      "invalid coefficient"
                  )

          validation = (
              data["validation"]
          )

          required_metrics = [
              "top1Accuracy",
              "winnerInTop3",
              "logLoss",
              "brierScore",
          ]

          for metric in (
              required_metrics
          ):
              value = (
                  validation.get(
                      metric
                  )
              )

              if value is None:
                  raise SystemExit(
                      f"missing metric: {metric}"
                  )

              if not math.isfinite(
                  float(value)
              ):
                  raise SystemExit(
                      f"invalid metric: {metric}"
                  )

          print(
              json.dumps(
                  {
                      "version":
                          data["version"],

                      "raceCount":
                          data["raceCount"],

                      "trainRaceCount":
                          data[
                              "trainRaceCount"
                          ],

                      "validationRaceCount":
                          data[
                              "validationRaceCount"
                          ],

                      "validation":
                          validation,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      - name: Run trifecta backtest
        run: |
          python training/backtest_trifecta.py \
            --days 30 \
            --min-races 500

      - name: Validate trifecta backtest
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = Path(
              "model/backtest.json"
          )

          if not path.exists():
              raise SystemExit(
                  "model/backtest.json "
                  "was not generated"
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          required = [
              "version",
              "modelVersion",
              "days",
              "raceCount",
              "top1",
              "top3",
              "top5",
              "actualRank",
              "winnerLane1",
              "winnerNotLane1",
              "byVenue",
          ]

          missing = [
              key
              for key in required
              if key not in data
          ]

          if missing:
              raise SystemExit(
                  f"backtest missing keys: "
                  f"{missing}"
              )

          if data["raceCount"] < 500:
              raise SystemExit(
                  "too few backtest races"
              )

          for section in (
              "top1",
              "top3",
              "top5",
          ):
              result = data[section]

              for metric in (
                  "hitRate",
                  "roi",
              ):
                  value = result.get(
                      metric
                  )

                  if value is None:
                      raise SystemExit(
                          f"{section}: "
                          f"missing {metric}"
                      )

                  if not math.isfinite(
                      float(value)
                  ):
                      raise SystemExit(
                          f"{section}: "
                          f"invalid {metric}"
                      )

          print(
              json.dumps(
                  {
                      "version":
                          data["version"],

                      "modelVersion":
                          data[
                              "modelVersion"
                          ],

                      "raceCount":
                          data[
                              "raceCount"
                          ],

                      "top1":
                          data["top1"],

                      "top3":
                          data["top3"],

                      "top5":
                          data["top5"],

                      "actualRank":
                          data[
                              "actualRank"
                          ],
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      - name: Commit model and backtest
        run: |
          git config \
            user.name \
            "boat-race-ai-bot"

          git config \
            user.email \
            "boat-race-ai-bot@users.noreply.github.com"

          git add \
            model/model.json \
            model/backtest.json

          if git diff \
            --cached \
            --quiet
          then
            echo \
              "Model and backtest did not change."
            exit 0
          fi

          git commit \
            -m "chore: retrain BOAT RACE AI v8"

          git push \
            origin \
            HEAD:main
