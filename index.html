<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>BOAT RACE AI</title><style>body{margin:0;background:#07111f;color:#fff;font-family:-apple-system;padding:18px}.c{max-width:720px;margin:auto}.card{background:#101d2e;border:1px solid #26384f;border-radius:16px;padding:16px;margin:14px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #38506d;background:#0b1625;color:#fff;font-size:16px}button{background:#1677ff;border:0;font-weight:700;margin-top:12px}.pick{padding:12px 0;border-bottom:1px solid #2a3b52}.combo{font-size:24px;font-weight:800}.m{color:#9fb0c6;font-size:12px;line-height:1.5}a{color:#7bb7ff}</style></head><body><main class='c'><h1>BOAT RACE AI</h1><div class='m'>公式公開データを使う3連単分析MVP</div><section class='card'><div class='g'><input id='date' type='date'><select id='race'></select><select id='venue'></select><input id='budget' value='1000' inputmode='numeric'></div><button id='go'>分析する</button></section><section id='out' class='card'><div id='status'>未分析</div><div id='meta' class='m'></div><div id='picks'></div><div id='reason' class='m'></div></section><p class='m'>自動投票は行いません。確率は校正済み機械学習モデルではなくヒューリスティックです。</p></main><script>
const vs=[['01','桐生'],['02','戸田'],['03','江戸川'],['04','平和島'],['05','多摩川'],['06','浜名湖'],['07','蒲郡'],['08','常滑'],['09','津'],['10','三国'],['11','びわこ'],['12','住之江'],['13','尼崎'],['14','鳴門'],['15','丸亀'],['16','児島'],['17','宮島'],['18','徳山'],['19','下関'],['20','若松'],['21','芦屋'],['22','福岡'],['23','唐津'],['24','大村']];const v=document.getElementById('venue');vs.forEach(x=>{let o=new Option(x[0]+' '+x[1],x[0]);v.add(o)});v.value='15';const r=document.getElementById('race');for(let i=1;i<=12;i++)r.add(new Option(i+'R',i));date.value=new Date().toISOString().slice(0,10);
go.onclick=async()=>{status.textContent='取得・分析中…';picks.innerHTML='';try{const q=new URLSearchParams({date:date.value,venue:v.value,race:r.value,budget:budget.value});const x=await fetch('/api/predict?'+q);const d=await x.json();if(!x.ok)throw Error(d.error||'取得失敗');status.textContent=d.skip?'見送り':'候補あり';meta.textContent=`${d.venueName} ${d.race}R / オッズ ${d.oddsCount}通り`;picks.innerHTML=d.picks.map((p,i)=>`<div class='pick'><div>${['◎ 本命','○ 対抗','▲ 穴'][i]}</div><div class='combo'>${p.combo}</div><b>¥${p.amount}・${p.odds.toFixed(1)}倍</b><div class='m'>払戻目安 ¥${Math.floor(p.amount*p.odds)} / 指標EV ${p.ev.toFixed(2)}</div></div>`).join('');reason.textContent=d.reason}catch(e){status.textContent='エラー';reason.textContent=e.message}}
</script></body></html>
