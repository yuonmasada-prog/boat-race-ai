<script>
const VENUES=[
  ['01','桐生'],
  ['02','戸田'],
  ['03','江戸川'],
  ['04','平和島'],
  ['05','多摩川'],
  ['06','浜名湖'],
  ['07','蒲郡'],
  ['08','常滑'],
  ['09','津'],
  ['10','三国'],
  ['11','びわこ'],
  ['12','住之江'],
  ['13','尼崎'],
  ['14','鳴門'],
  ['15','丸亀'],
  ['16','児島'],
  ['17','宮島'],
  ['18','徳山'],
  ['19','下関'],
  ['20','若松'],
  ['21','芦屋'],
  ['22','福岡'],
  ['23','唐津'],
  ['24','大村']
];

const $=id=>document.getElementById(id);

let trainedModel=null;

VENUES.forEach(v=>{
  $('venue').add(
    new Option(`${v[0]} ${v[1]}`,v[0])
  );
});

for(let r=1;r<=12;r++){
  $('race').add(
    new Option(`${r}R`,r)
  );
}

function todayJst(){
  return new Date(
    Date.now()+9*60*60*1000
  ).toISOString().slice(0,10);
}

$('date').value=todayJst();

function finite(v){
  if(v===null || v===undefined || v===''){
    return null;
  }

  const n=Number(v);
  return Number.isFinite(n)?n:null;
}

function safe(v,fallback=0){
  const n=finite(v);
  return n===null?fallback:n;
}

function pct(v,digits=1){
  return `${(safe(v)*100).toFixed(digits)}%`;
}

function softmax(scores){
  const max=Math.max(...scores);

  const exps=scores.map(
    v=>Math.exp(v-max)
  );

  const total=exps.reduce(
    (a,b)=>a+b,
    0
  );

  return exps.map(
    v=>v/total
  );
}

async function fetchJson(url){
  const response=await fetch(
    url,
    {cache:'no-store'}
  );

  if(!response.ok){
    throw new Error(
      `HTTP ${response.status}`
    );
  }

  return response.json();
}

async function loadModel(){
  try{
    const model=await fetchJson(
      `/model/model.json?v=${Date.now()}`
    );

    const required=[
      'features',
      'mean',
      'scale',
      'coefficients'
    ];

    if(
      !required.every(
        key=>Array.isArray(model[key])
      )
    ){
      throw new Error(
        'model-invalid'
      );
    }

    const n=model.features.length;

    if(
      model.mean.length!==n ||
      model.scale.length!==n ||
      model.coefficients.length!==n
    ){
      throw new Error(
        'model-shape-invalid'
      );
    }

    trainedModel=model;

    $('modelApi').textContent='OK';
    $('modelApi').className='good';

    const validation=
      model.validation||{};

    $('modelInfo').innerHTML=
      `${model.version}<br>`+
      `学習 ${Number(model.raceCount||0).toLocaleString()}レース / `+
      `検証Top1 ${pct(validation.top1Accuracy)} / `+
      `Top3 ${pct(validation.winnerInTop3)}<br>`+
      `最終学習 ${String(model.trainedAt||'-')}`;

    return true;

  }catch(error){
    trainedModel=null;

    $('modelApi').textContent='失敗';
    $('modelApi').className='bad';

    $('modelInfo').textContent=
      `モデル読込失敗: ${error.message}`;

    return false;
  }
}

function normalizeRacers(raceData){
  const raw=
    Array.isArray(raceData?.racers)
      ?raceData.racers
      :Object.values(
          raceData?.racers||{}
        );

  return raw
    .filter(Boolean)
    .sort(
      (a,b)=>
        Number(a.lane)-Number(b.lane)
    );
}

function meetStats(racer){
  const items=
    Array.isArray(racer.currentMeet)
      ?racer.currentMeet
      :[];

  const finishes=items
    .map(x=>finite(x.finish))
    .filter(
      v=>
        v!==null &&
        v>=1 &&
        v<=6
    );

  const starts=items
    .map(x=>finite(x.st))
    .filter(
      v=>v!==null
    );

  return {
    finish:
      finishes.length
        ?finishes.reduce(
            (a,b)=>a+b,
            0
          )/finishes.length
        :null,

    st:
      starts.length
        ?starts.reduce(
            (a,b)=>a+b,
            0
          )/starts.length
        :null,

    count:items.length
  };
}

function rawFeatureMap(racer){
  const lane=Number(racer.lane);

  const meet=
    meetStats(racer);

  return {
    lane1:lane===1?1:0,
    lane2:lane===2?1:0,
    lane3:lane===3?1:0,
    lane4:lane===4?1:0,
    lane5:lane===5?1:0,
    lane6:lane===6?1:0,

    avg_st:
      finite(racer.avgSt),

    national_win:
      finite(racer.nationalWin),

    national2:
      finite(racer.national2),

    local_win:
      finite(racer.localWin),

    local2:
      finite(racer.local2),

    motor2:
      finite(racer.motor2),

    boat2:
      finite(racer.boat2),

    meet_avg_finish:
      meet.finish,

    meet_avg_st:
      meet.st
  };
}

function modelLaneProbabilities(racers){
  if(!trainedModel){
    throw new Error(
      'model-not-loaded'
    );
  }

  const scores=
    racers.map(racer=>{
      const raw=
        rawFeatureMap(racer);

      let score=0;

      trainedModel.features
        .forEach(
          (name,index)=>{
            let value=
              finite(raw[name]);

            if(value===null){
              value=
                trainedModel.mean[index];
            }

            const scale=
              Math.abs(
                trainedModel.scale[index]
              )>1e-9
                ?trainedModel.scale[index]
                :1;

            const standardized=
              (
                value-
                trainedModel.mean[index]
              )/scale;

            score+=
              standardized*
              trainedModel.coefficients[index];
          }
        );

      return score;
    });

  return softmax(scores);
}

function getBeforeBoat(before,lane){
  if(!before?.boats){
    return null;
  }

  if(Array.isArray(before.boats)){
    return (
      before.boats.find(
        b=>
          Number(
            b?.lane ??
            b?.boat ??
            b?.frame
          )===Number(lane)
      ) ||
      before.boats[lane-1] ||
      null
    );
  }

  return (
    before.boats[lane] ||
    before.boats[String(lane)] ||
    null
  );
}

function liveAdjustment(
  racer,
  beforeBoat
){
  let adjustment=0;

  if(beforeBoat){
    const exTime=
      finite(
        beforeBoat.exTime ??
        beforeBoat.exhibitionTime
      );

    const exSt=
      finite(
        beforeBoat.exSt ??
        beforeBoat.st
      );

    const exCourse=
      finite(
        beforeBoat.exCourse ??
        beforeBoat.course
      );

    if(exTime!==null){
      adjustment+=
        (6.80-exTime)*0.35;
    }

    if(exSt!==null){
      adjustment+=
        (0.16-exSt)*1.4;
    }

    if(
      exCourse!==null &&
      exCourse!==
        Number(racer.lane)
    ){
      adjustment+=
        Math.log(
          (
            Number(racer.lane)+0.5
          )/
          (
            exCourse+0.5
          )
        )*0.10;
    }

    if(
      beforeBoat.exFlying ||
      beforeBoat.flying
    ){
      adjustment-=0.08;
    }
  }

  adjustment-=
    Math.min(
      safe(
        racer.fCount ??
        racer.F
      )*0.04,
      0.12
    );

  return adjustment;
}

function adjustedLaneProbabilities(
  racers,
  before
){
  const ml=
    modelLaneProbabilities(
      racers
    );

  const scores=
    ml.map(
      (p,index)=>{
        const lane=
          Number(
            racers[index].lane ||
            index+1
          );

        const boat=
          getBeforeBoat(
            before,
            lane
          );

        return (
          Math.log(
            Math.max(p,1e-9)
          )+
          liveAdjustment(
            racers[index],
            boat
          )
        );
      }
    );

  return softmax(scores);
}

function trifectaProbabilities(
  laneProb
){
  const output={};

  for(
    let first=1;
    first<=6;
    first++
  ){
    for(
      let second=1;
      second<=6;
      second++
    ){
      if(second===first){
        continue;
      }

      for(
        let third=1;
        third<=6;
        third++
      ){
        if(
          third===first ||
          third===second
        ){
          continue;
        }

        const p1=
          laneProb[first-1];

        const remaining1=
          1-p1;

        const p2=
          laneProb[second-1]/
          Math.max(
            remaining1,
            1e-9
          );

        const remaining2=
          1-
          laneProb[first-1]-
          laneProb[second-1];

        const p3=
          laneProb[third-1]/
          Math.max(
            remaining2,
            1e-9
          );

        output[
          `${first}${second}${third}`
        ]=
          p1*p2*p3;
      }
    }
  }

  const total=
    Object.values(output)
      .reduce(
        (a,b)=>a+b,
        0
      );

  if(total>0){
    Object.keys(output)
      .forEach(k=>{
        output[k]/=total;
      });
  }

  return output;
}

function normalizeMarket(
  oddsData
){
  if(
    oddsData?.marketProbabilities &&
    Object.keys(
      oddsData.marketProbabilities
    ).length
  ){
    return oddsData
      .marketProbabilities;
  }

  const rawOdds=
    oddsData?.odds||{};

  const market={};

  let total=0;

  Object.entries(rawOdds)
    .forEach(
      ([combo,value])=>{
        const odd=
          finite(value);

        if(
          odd!==null &&
          odd>0
        ){
          market[combo]=
            1/odd;

          total+=
            market[combo];
        }
      }
    );

  if(total>0){
    Object.keys(market)
      .forEach(k=>{
        market[k]/=total;
      });
  }

  return market;
}

function combineMarket(
  modelProb,
  marketProb
){
  const output={};

  const modelWeight=0.67;
  const marketWeight=0.33;

  Object.keys(modelProb)
    .forEach(combo=>{
      const m=
        Math.max(
          modelProb[combo]||0,
          1e-12
        );

      const market=
        Math.max(
          marketProb?.[combo]||0,
          1e-12
        );

      output[combo]=
        Math.pow(
          m,
          modelWeight
        )*
        Math.pow(
          market,
          marketWeight
        );
    });

  const total=
    Object.values(output)
      .reduce(
        (a,b)=>a+b,
        0
      );

  if(total>0){
    Object.keys(output)
      .forEach(k=>{
        output[k]/=total;
      });
  }

  return output;
}

function chooseBets(
  finalProb,
  modelProb,
  odds,
  budget
){
  const candidates=
    Object.keys(finalProb)
      .map(combo=>{
        const odd=
          finite(
            odds?.[combo]
          );

        const p=
          finalProb[combo];

        const pure=
          modelProb[combo];

        const marketEdgeWeight=
          odd!==null
            ?Math.min(
                Math.sqrt(odd),
                7
              )
            :1;

        return {
          combo,
          odd,
          p,
          pure,
          score:
            p*
            marketEdgeWeight
        };
      })
      .filter(
        x=>
          x.odd!==null &&
          x.odd>=1 &&
          x.odd<=100 &&
          x.p>=0.018
      )
      .sort(
        (a,b)=>
          b.score-a.score
      );

  if(!candidates.length){
    return [];
  }

  if(candidates[0].p<0.03){
    return [];
  }

  const units=
    Math.max(
      1,
      Math.floor(
        budget/100
      )
    );

  let count=1;

  if(units>=4){
    count=2;
  }

  if(units>=8){
    count=3;
  }

  const selected=
    candidates.slice(
      0,
      count
    );

  let remaining=
    Math.floor(
      budget/100
    )*100;

  selected.forEach(
    (item,index)=>{
      const slots=
        selected.length-index;

      const amount=
        index===
        selected.length-1
          ?remaining
          :Math.max(
              100,
              Math.floor(
                remaining/
                slots/
                100
              )*100
            );

      item.amount=
        amount;

      remaining-=
        amount;
    }
  );

  return selected;
}

/*
  v7.4.1 FIX

  必須データ:
  出走表      25%
  展示・気象  25%
  オッズ      25%
  MLモデル    25%

  今節成績は補助情報。
  取得できないことだけを理由に
  予想を停止しない。
*/
function requiredDataStatus(
  raceData,
  before,
  oddsData,
  modelOk
){
  const racers=
    normalizeRacers(
      raceData
    );

  const raceOk=
    Boolean(
      raceData?.ok &&
      racers.length===6
    );

  const beforeBoatCount=
    Array.isArray(before?.boats)
      ?before.boats.filter(Boolean).length
      :before?.boats
        ?Object.values(
            before.boats
          ).filter(Boolean).length
        :0;

  const beforeOk=
    Boolean(
      before?.ok &&
      (
        Number(
          before.parsedCount
        )>=6 ||
        beforeBoatCount>=6
      )
    );

  const oddsCount=
    Number(
      oddsData?.oddsCount ||
      Object.keys(
        oddsData?.odds||{}
      ).length
    );

  const oddsOk=
    Boolean(
      oddsData?.ok &&
      oddsCount>=120
    );

  const mlOk=
    Boolean(
      modelOk &&
      trainedModel
    );

  const score=
    (raceOk?25:0)+
    (beforeOk?25:0)+
    (oddsOk?25:0)+
    (mlOk?25:0);

  return {
    raceOk,
    beforeOk,
    oddsOk,
    mlOk,
    score
  };
}

function renderRows(
  racers,
  before,
  laneProb
){
  $('rows').innerHTML=
    racers.map(
      (r,index)=>{
        const lane=
          Number(
            r.lane ||
            index+1
          );

        const b=
          getBeforeBoat(
            before,
            lane
          )||{};

        const exTime=
          b.exTime ??
          b.exhibitionTime ??
          '-';

        return `
          <tr>
            <td>${lane}</td>
            <td>${r.name||'-'}</td>
            <td>${r.grade||'-'}</td>
            <td>${r.nationalWin??'-'}</td>
            <td>${r.localWin??'-'}</td>
            <td>${r.avgSt??'-'}</td>
            <td>${r.motor2??'-'}</td>
            <td>${exTime}</td>
            <td>
              <b>
                ${pct(laneProb[index])}
              </b>
            </td>
          </tr>
        `;
      }
    ).join('');
}

function renderPicks(
  picks,
  market
){
  if(!picks.length){
    $('picks').innerHTML='';
    return;
  }

  const labels=[
    '◎ 本命',
    '○ 対抗',
    '△ 押さえ'
  ];

  $('picks').innerHTML=
    picks.map(
      (pick,index)=>{
        const combo=
          pick.combo
            .split('')
            .join('-');

        const marketP=
          market?.[
            pick.combo
          ]||0;

        const payout=
          Math.floor(
            pick.amount*
            pick.odd
          );

        return `
          <div class="pick">

            <div class="sub">
              ${labels[index]||'候補'}
            </div>

            <div class="combo">
              ${combo}
            </div>

            <div class="amount">
              ¥${pick.amount.toLocaleString()}
              /
              ${pick.odd.toFixed(1)}倍
            </div>

            <div class="metrics">

              <div class="metric">
                <small>
                  統合モデル推定
                </small>
                <b>
                  ${pct(pick.p)}
                </b>
              </div>

              <div class="metric">
                <small>
                  市場基準
                </small>
                <b>
                  ${pct(marketP)}
                </b>
              </div>

              <div class="metric">
                <small>
                  ML単独
                </small>
                <b>
                  ${pct(pick.pure)}
                </b>
              </div>

              <div class="metric">
                <small>
                  的中時目安
                </small>
                <b>
                  ¥${payout.toLocaleString()}
                </b>
              </div>

            </div>
          </div>
        `;
      }
    ).join('');
}

function setApiState(
  id,
  ok
){
  $(id).textContent=
    ok?'OK':'不足';

  $(id).className=
    ok?'good':'bad';
}

async function analyze(){
  const date=
    $('date').value;

  const venue=
    $('venue').value;

  const race=
    Number(
      $('race').value
    );

  const budget=
    Math.max(
      100,
      Math.floor(
        safe(
          $('budget').value,
          300
        )/100
      )*100
    );

  $('analyze').disabled=true;

  $('status').textContent=
    'データ取得中…';

  $('status').className=
    'status warn';

  $('picks').innerHTML='';
  $('reason').textContent='';

  $('detail')
    .classList
    .add('hidden');

  $('raceApi').textContent=
    '取得中';

  $('beforeApi').textContent=
    '取得中';

  $('oddsApi').textContent=
    '取得中';

  if(!trainedModel){
    $('modelApi').textContent=
      '取得中';
  }

  const q=
    `date=${encodeURIComponent(date)}`+
    `&venue=${encodeURIComponent(venue)}`+
    `&race=${race}`;

  try{
    const modelPromise=
      trainedModel
        ?Promise.resolve(true)
        :loadModel();

    const results=
      await Promise.allSettled([
        fetchJson(
          `/api/race?${q}`
        ),
        fetchJson(
          `/api/before?${q}`
        ),
        fetchJson(
          `/api/odds?${q}`
        ),
        modelPromise
      ]);

    const raceData=
      results[0].status===
      'fulfilled'
        ?results[0].value
        :null;

    const before=
      results[1].status===
      'fulfilled'
        ?results[1].value
        :null;

    const oddsData=
      results[2].status===
      'fulfilled'
        ?results[2].value
        :null;

    const modelOk=
      results[3].status===
      'fulfilled' &&
      results[3].value &&
      trainedModel;

    const required=
      requiredDataStatus(
        raceData,
        before,
        oddsData,
        modelOk
      );

    setApiState(
      'raceApi',
      required.raceOk
    );

    setApiState(
      'beforeApi',
      required.beforeOk
    );

    setApiState(
      'oddsApi',
      required.oddsOk
    );

    setApiState(
      'modelApi',
      required.mlOk
    );

    $('coverageArea')
      .classList
      .remove('hidden');

    $('coverage').textContent=
      `${required.score}%`;

    $('coverageBar').style.width=
      `${required.score}%`;

    const meetAvailable=
      Boolean(
        raceData?.currentMeetDetected
      );

    $('supplementInfo').textContent=
      meetAvailable
        ?`今節成績: 取得済み（補助特徴量として使用）`
        :`今節成績: 未取得（学習時平均で補完・分析は継続）`;

    const oddsCount=
      Number(
        oddsData?.oddsCount ||
        Object.keys(
          oddsData?.odds||{}
        ).length
      );

    $('raceInfo').textContent=
      `${raceData?.venueName||venue} ${race}R / `+
      `オッズ ${oddsCount}通り / `+
      `${trainedModel?.version||'model unavailable'}`;

    if(required.score<100){
      $('status').textContent=
        '見送り';

      $('status').className=
        'status bad';

      const missing=[];

      if(!required.raceOk){
        missing.push('出走表');
      }

      if(!required.beforeOk){
        missing.push('展示・気象');
      }

      if(!required.oddsOk){
        missing.push('オッズ');
      }

      if(!required.mlOk){
        missing.push('MLモデル');
      }

      $('reason').textContent=
        `必須データ不足: ${missing.join(' / ')}`;

      return;
    }

    const racers=
      normalizeRacers(
        raceData
      );

    const laneProb=
      adjustedLaneProbabilities(
        racers,
        before
      );

    const trifecta=
      trifectaProbabilities(
        laneProb
      );

    const market=
      normalizeMarket(
        oddsData
      );

    const combined=
      combineMarket(
        trifecta,
        market
      );

    const picks=
      chooseBets(
        combined,
        trifecta,
        oddsData.odds,
        budget
      );

    renderRows(
      racers,
      before,
      laneProb
    );

    renderPicks(
      picks,
      market
    );

    $('detail')
      .classList
      .remove('hidden');

    const w=
      before.weather||{};

    $('weather').textContent=
      `気温 ${w.temperature??'-'}℃ / `+
      `水温 ${w.waterTemperature??'-'}℃ / `+
      `風 ${w.windSpeed??'-'}m/s / `+
      `波 ${w.waveHeight??'-'}cm`;

    const validation=
      trainedModel.validation||{};

    $('tags').innerHTML=
      [
        `学習 ${Number(trainedModel.raceCount||0).toLocaleString()}R`,
        `検証 ${Number(trainedModel.validationRaceCount||0).toLocaleString()}R`,
        `ML Top1 ${pct(validation.top1Accuracy)}`,
        meetAvailable
          ?`今節データ 取得済`
          :`今節データ 平均補完`
      ]
      .map(
        x=>
          `<span class="tag">${x}</span>`
      )
      .join('');

    if(!picks.length){
      $('status').textContent=
        '見送り';

      $('status').className=
        'status warn';

      $('reason').textContent=
        '必須データは100%取得済み。ただしモデル上の候補強度が基準未満のため見送ります。';

      return;
    }

    $('status').textContent=
      '候補あり';

    $('status').className=
      'status good';

    const maxLaneProb=
      Math.max(
        ...laneProb
      );

    const topIndex=
      laneProb.indexOf(
        maxLaneProb
      );

    const topLane=
      Number(
        racers[topIndex]?.lane ||
        topIndex+1
      );

    $('reason').textContent=
      `必須データ100%。`+
      `v7.4学習モデルでは${topLane}号艇を1着最有力 `+
      `(${pct(maxLaneProb)}) と評価。`+
      `学習モデルを基礎に展示情報で直前補正し、`+
      `3連単120通りを市場オッズと統合して候補を選択しています。`;

  }catch(error){
    $('status').textContent=
      '見送り';

    $('status').className=
      'status bad';

    $('reason').textContent=
      `分析エラー: ${error.message}`;

  }finally{
    $('analyze').disabled=false;
  }
}

$('analyze')
  .addEventListener(
    'click',
    analyze
  );

loadModel();
</script>

</body>
</html>
